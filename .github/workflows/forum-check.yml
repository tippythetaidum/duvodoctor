name: forum check

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: forum-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - id: forum
        run: node scripts/forum-check.ts --report forum-report.md

      - name: Open an issue with what changed
        if: steps.forum.outputs.findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create forum-check --color 1d2a44 --description "Daily read of the Luduvo forum" 2>/dev/null || true
          gh issue create --title "Forum check, $(date -u +'%-d %b %Y')" --label forum-check --body-file forum-report.md

      - name: Test and build with the new build number
        if: steps.forum.outputs.changed == 'true'
        run: |
          npm run check
          npm test
          npm run build

      - name: Commit the new build number
        if: steps.forum.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/luduvo.json
          git commit -m "record luduvo build ${{ steps.forum.outputs.build }} from the forum"
          git push

      - id: cloudflare
        if: steps.forum.outputs.changed == 'true'
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy build --project-name duvodoctor --branch main
